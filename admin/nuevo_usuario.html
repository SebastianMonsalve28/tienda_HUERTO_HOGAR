<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Administrador | Nuevo Usuario
    </title>

    <link
        rel="stylesheet"
        href="../css/estilos.css">

</head>

<body class="admin-body">


<header class="admin-header">

    <h2>
        Panel de Administración - HuertoHogar
    </h2>

    <a
        href="../index.html"
        class="boton">

        Volver a la tienda

    </a>

</header>


<div class="admin-shell">


<aside class="menu-admin">

    <h2>HuertoHogar</h2>

    <h3>Administrador</h3>

    <a href="index.html">
        Inicio
    </a>

    <a href="productos.html">
        Gestión de Productos
    </a>

    <a href="nuevo-producto.html">
        Nuevo Producto
    </a>

    <a href="usuarios.html">
        Gestión de Usuarios
    </a>

    <a
        href="nuevo-usuario.html"
        class="activo">

        Nuevo Usuario

    </a>

</aside>


<main class="contenido-admin">


<h1>
    Nuevo Usuario
</h1>


<section class="form-admin">


<form action="usuarios.html">


<label>
    RUN
</label>

<input
    type="text"
    minlength="7"
    maxlength="9"
    required>


<label>
    Nombre
</label>

<input
    type="text"
    maxlength="50"
    required>


<label>
    Apellidos
</label>

<input
    type="text"
    maxlength="100"
    required>


<label>
    Correo
</label>

<input
    type="email"
    maxlength="100"
    required>


<label>
    Tipo de Usuario
</label>

<select required>

    <option>
        Administrador
    </option>

    <option>
        Cliente
    </option>

    <option>
        Vendedor
    </option>

</select>


<label>
    Dirección
</label>

<input
    type="text"
    maxlength="300"
    required>


<div class="acciones-form-admin">


<button
    class="boton"
    type="submit">

    Guardar Usuario

</button>


<a
    href="usuarios.html"
    class="boton secundario">

    Cancelar

</a>


</div>


</form>


</section>


</main>

</div>

</body>

</html>
