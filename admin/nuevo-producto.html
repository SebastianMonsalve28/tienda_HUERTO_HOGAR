<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Nuevo Producto</title>

<link rel="stylesheet"
href="../css/estilos.css">

</head>

<body>

<main class="formulario">

<h1>Nuevo Producto</h1>

<form>

<label>
Código
</label>

<input
type="text"
minlength="3"
required>


<label>
Nombre
</label>

<input
type="text"
maxlength="100"
required>


<label>
Descripción
</label>

<textarea
maxlength="500">
</textarea>


<label>
Precio
</label>

<input
type="number"
min="0"
required>


<label>
Stock
</label>

<input
type="number"
min="0"
required>


<label>
Stock Crítico
</label>

<input
type="number"
min="0">


<label>
Categoría
</label>

<select required>

<option value="">
Seleccione
</option>

<option>
Frutas Frescas
</option>

<option>
Verduras Orgánicas
</option>

<option>
Productos Orgánicos
</option>

<option>
Productos Lácteos
</option>

</select>


<label>
Imagen
</label>

<input type="file">


<button
class="boton"
type="submit">

Guardar

</button>

<a
class="boton secundario"
href="productos.html">

Volver

</a>


</form>

</main>

</body>

</html>
