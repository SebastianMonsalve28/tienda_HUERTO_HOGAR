<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Administrador | Nuevo Producto
    </title>

    <link
        rel="stylesheet"
        href="../css/estilos.css">

</head>

<body class="admin-body">


<header class="admin-header">

    <h2>
        Panel de Administración - HuertoHogar
    </h2>

    <a
        href="../index.html"
        class="boton">

        Volver a la tienda

    </a>

</header>


<div class="admin-shell">


<aside class="menu-admin">

    <h2>HuertoHogar</h2>

    <h3>Administrador</h3>

    <a href="index.html">
        Inicio
    </a>

    <a href="productos.html">
        Gestión de Productos
    </a>

    <a
        href="nuevo-producto.html"
        class="activo">

        Nuevo Producto

    </a>

    <a href="usuarios.html">
        Gestión de Usuarios
    </a>

    <a href="nuevo-usuario.html">
        Nuevo Usuario
    </a>

</aside>


<main class="contenido-admin">


<h1>
    Nuevo Producto
</h1>


<section class="form-admin">


<form action="productos.html">


<label for="codigoProducto">
    Código
</label>

<input
    id="codigoProducto"
    type="text"
    minlength="3"
    required>


<label for="nombreProducto">
    Nombre
</label>

<input
    id="nombreProducto"
    type="text"
    maxlength="100"
    required>


<label for="descripcionProducto">
    Descripción
</label>

<textarea
    id="descripcionProducto"
    maxlength="500"
    rows="4">
</textarea>


<label for="precioProducto">
    Precio
</label>

<input
    id="precioProducto"
    type="number"
    min="0"
    required>


<label for="stockProducto">
    Stock
</label>

<input
    id="stockProducto"
    type="number"
    min="0"
    required>


<label for="stockCritico">
    Stock Crítico
</label>

<input
    id="stockCritico"
    type="number"
    min="0">


<label for="categoriaProducto">
    Categoría
</label>

<select
    id="categoriaProducto"
    required>

    <option value="">
        Seleccione
    </option>

    <option>
        Frutas Frescas
    </option>

    <option>
        Verduras Orgánicas
    </option>

    <option>
        Productos Orgánicos
    </option>

    <option>
        Productos Lácteos
    </option>

</select>


<label for="imagenProducto">
    Imagen
</label>

<input
    id="imagenProducto"
    type="file">


<div class="acciones-form-admin">

    <button
        class="boton"
        type="submit">

        Guardar

    </button>


    <a
        href="productos.html"
        class="boton secundario">

        Cancelar

    </a>

</div>


</form>


</section>


</main>

</div>

</body>

</html>
