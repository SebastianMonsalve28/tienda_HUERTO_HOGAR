<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Administrador | Editar Producto
    </title>

    <link
        rel="stylesheet"
        href="../css/estilos.css">

</head>

<body class="admin-body">


<header class="admin-header">

    <h2>
        Panel de Administración - HuertoHogar
    </h2>

    <a
        href="../index.html"
        class="boton">

        Volver a la tienda

    </a>

</header>


<div class="admin-shell">


<aside class="menu-admin">

    <h2>HuertoHogar</h2>

    <h3>Administrador</h3>

    <a href="index.html">
        Inicio
    </a>

    <a
        href="productos.html"
        class="activo">

        Gestión de Productos

    </a>

    <a href="nuevo-producto.html">
        Nuevo Producto
    </a>

    <a href="usuarios.html">
        Gestión de Usuarios
    </a>

    <a href="nuevo-usuario.html">
        Nuevo Usuario
    </a>

</aside>


<main class="contenido-admin">


<h1>
    Editar Producto
</h1>


<section class="form-admin">


<form action="productos.html">


<label>
    Código
</label>

<input
    type="text"
    value="FR001"
    required>


<label>
    Nombre
</label>

<input
    type="text"
    value="Manzanas Fuji"
    required>


<label>
    Descripción
</label>

<textarea rows="4">
Manzanas Fuji crujientes y dulces cultivadas en el Valle del Maule.
</textarea>


<label>
    Precio
</label>

<input
    type="number"
    value="1200"
    min="0"
    required>


<label>
    Stock
</label>

<input
    type="number"
    value="150"
    min="0"
    required>


<label>
    Categoría
</label>

<select>

    <option selected>
        Frutas Frescas
    </option>

    <option>
        Verduras Orgánicas
    </option>

    <option>
        Productos Orgánicos
    </option>

    <option>
        Productos Lácteos
    </option>

</select>


<div class="acciones-form-admin">


<button
    class="boton"
    type="submit">

    Guardar cambios

</button>


<a
    href="productos.html"
    class="boton secundario">

    Cancelar

</a>


</div>


</form>


</section>


</main>

</div>

</body>

</html>
