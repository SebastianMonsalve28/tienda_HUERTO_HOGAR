<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Editar Producto</title>

<link rel="stylesheet"
href="../css/estilos.css">

</head>

<body>

<main class="formulario">


<h1>Editar Producto</h1>


<form>


<label>Código</label>

<input
type="text"
value="FR001"
required>


<label>Nombre</label>

<input
type="text"
value="Manzanas Fuji"
required>


<label>Descripción</label>

<textarea>
Manzanas frescas y dulces.
</textarea>


<label>Precio</label>

<input
type="number"
value="1200"
required>


<label>Stock</label>

<input
type="number"
value="150"
required>


<label>Categoría</label>

<select>

<option>
Frutas Frescas
</option>

<option>
Verduras Orgánicas
</option>

<option>
Productos Orgánicos
</option>

</select>


<button
class="boton"
type="submit">

Guardar cambios

</button>

<a
class="boton secundario"
href="productos.html">

Volver

</a>


</form>

</main>

</body>

</html>
