<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Nuevo Usuario</title>

<link
rel="stylesheet"
href="../css/estilos.css">

</head>

<body>


<main class="formulario">


<h1>Nuevo Usuario</h1>


<form>


<label>RUN</label>

<input
type="text"
minlength="7"
maxlength="9"
required>


<label>Nombre</label>

<input
type="text"
maxlength="50"
required>


<label>Apellidos</label>

<input
type="text"
maxlength="100"
required>


<label>Correo</label>

<input
type="email"
maxlength="100"
required>


<label>
Fecha de nacimiento
</label>

<input type="date">


<label>
Tipo Usuario
</label>

<select>

<option>
Administrador
</option>

<option>
Cliente
</option>

<option>
Vendedor
</option>

</select>


<label>Dirección</label>

<input
type="text"
maxlength="300"
required>


<button
class="boton"
type="submit">

Guardar Usuario

</button>


<a
class="boton secundario"
href="usuarios.html">

Volver

</a>


</form>

</main>

</body>

</html>
