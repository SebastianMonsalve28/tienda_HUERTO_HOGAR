<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HuertoHogar | Carrito</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>

<body>

<header>

    <div class="logo">

        <h1>HuertoHogar</h1>

    </div>

    <nav>

        <ul>

            <li>
                <a href="index.html">
                    Inicio
                </a>
            </li>

            <li>
                <a href="productos.html">
                    Productos
                </a>
            </li>

            <li>
                <a href="nosotros.html">
                    Nosotros
                </a>
            </li>

            <li>
                <a href="blog.html">
                    Blog
                </a>
            </li>

            <li>
                <a href="contacto.html">
                    Contacto
                </a>
            </li>

        </ul>

    </nav>

    <div class="usuario">

        <a href="login.html">
            Iniciar sesión
        </a>

        <a href="registro.html">
            Registrarse
        </a>

        <a
            href="carrito.html"
            class="enlace-carrito">

            Carrito
            (<span id="contadorCarrito">0</span>)

        </a>

    </div>

</header>

<main>

    <section class="contenido">

        <div class="carrito-titulo">

            <div>

                <h1>
                    Mi carrito de compras
                </h1>

                <p>
                    Revisa los productos
                    agregados a tu carrito.
                </p>

            </div>

            <a
                href="productos.html"
                class="boton secundario">

                Seguir comprando

            </a>

        </div>

        <div class="carrito-layout">

            <div
                id="carritoContenido"
                class="carrito-lista">

            </div>

            <aside class="resumen-carrito">

                <h2>
                    Resumen
                </h2>

                <div class="linea-resumen">

                    <span>
                        Productos
                    </span>

                    <span id="cantidadResumen">
                        0
                    </span>

                </div>

                <div class="linea-resumen">

                    <span>
                        Subtotal
                    </span>

                    <span id="subtotalCarrito">
                        $0
                    </span>

                </div>

                <div class="linea-resumen total-resumen">

                    <span>
                        Total
                    </span>

                    <span id="totalCarrito">
                        $0
                    </span>

                </div>

                <div class="botones-carrito">

                    <button
                        id="pagarCarrito"
                        class="boton"
                        type="button">

                        Realizar compra

                    </button>

                    <button
                        id="vaciarCarrito"
                        class="boton secundario"
                        type="button">

                        Vaciar carrito

                    </button>

                </div>

            </aside>

        </div>

    </section>

</main>

<footer>

    <p>
        2026 HuertoHogar - Sebastian Monsalve - Lucas Parra
    </p>

</footer>

<script src="js/notificaciones.js"></script>
<script src="js/productos.js"></script>
<script src="js/sesion.js"></script>
<script src="js/carrito.js"></script>

</body>

</html>
